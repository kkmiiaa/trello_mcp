name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run format
      - run: npm run build
      - run: npm test
        env:
          TRELLO_API_KEY: test-key
          TRELLO_API_TOKEN: test-token

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_NAME: trello-actions-proxy
      REGION: asia-northeast1
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      AR_REPO: ${{ secrets.GCP_ARTIFACT_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image with Cloud Build
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE_NAME}:${GITHUB_SHA}"
          gcloud builds submit \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --service-account "projects/${PROJECT_ID}/serviceAccounts/${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}" \
            --gcs-log-dir "gs://${{ secrets.GCP_CLOUD_BUILD_LOGS_BUCKET }}/cloud-build" \
            --tag "${IMAGE_URI}" \
            .
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_URI}" \
            --allow-unauthenticated \
            --set-env-vars "TRELLO_API_KEY=${{ secrets.TRELLO_API_KEY }},TRELLO_API_TOKEN=${{ secrets.TRELLO_API_TOKEN }},TRELLO_ALLOWED_BOARD_IDS=${{ secrets.TRELLO_ALLOWED_BOARD_IDS }},INTERNAL_TOKEN=${{ secrets.INTERNAL_TOKEN }},PREVIEW_TOKEN_SECRET=${{ secrets.PREVIEW_TOKEN_SECRET }}"
