name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run format
      - run: npm run build
      - run: npm test
        env:
          TRELLO_API_KEY: test-key
          TRELLO_API_TOKEN: test-token
